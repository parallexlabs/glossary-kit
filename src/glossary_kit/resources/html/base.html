<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — Glossary</title>
  <style>
    :root { --focus: #005fcc; --bg: #fff; --text: #1a1a1a; --muted: #555; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; line-height: 1.5; margin: 0; color: var(--text); background: var(--bg); }
    a { color: var(--focus); }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .skip-link { position: absolute; left: -9999px; top: 0; background: var(--focus); color: #fff; padding: 0.5rem 1rem; z-index: 100; }
    .skip-link:focus { left: 0; }
    header, main, footer, nav { display: block; }
    header { padding: 1rem 2rem; border-bottom: 1px solid #ddd; }
    main { padding: 1rem 2rem; max-width: 60rem; }
    footer { padding: 1rem 2rem; border-top: 1px solid #ddd; color: var(--muted); font-size: 0.9rem; }
    nav ul { list-style: none; padding: 0; columns: 4; gap: 1rem; }
    nav li { margin-bottom: 0.25rem; }
    .search { margin: 1rem 0; }
    .search label { font-weight: 600; margin-right: 0.5rem; }
    #search-status { min-height: 1.5rem; }
    .letter-nav a { margin-right: 0.5rem; }
    .demo-banner { background: #fff3cd; border: 1px solid #ffc107; padding: 0.75rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header role="banner">
    <h1>{{ title }}</h1>
    {% if description %}<p>{{ description }}</p>{% endif %}
  </header>
  {% block content %}{% endblock %}
  <footer role="contentinfo">
    {% if attribution %}<p>{{ attribution }}</p>{% endif %}
    <p>Generated by Glossary Kit</p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
