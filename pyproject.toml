[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glossary-kit"
version = "0.1.0"
description = "Glossary-as-code toolkit for public-sector data governance"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ParalleX Labs Inc." }]
keywords = ["glossary", "skos", "data-governance", "metadata"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "rdflib>=7.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1",
    "types-PyYAML",
    "types-jsonschema",
]

[project.scripts]
glossary-kit = "glossary_kit.cli.main:app_main"
glossaryctl = "glossary_kit.cli.main:app_main"

[project.urls]
Homepage = "https://github.com/parallexlabs/glossary-kit"
Documentation = "https://github.com/parallexlabs/glossary-kit#readme"
Repository = "https://github.com/parallexlabs/glossary-kit"

[tool.hatch.build.targets.wheel]
only-packages = true

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.editable]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
only-include = ["src/glossary_kit", "examples", "tests", "pyproject.toml", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["glossary_kit"]
mypy_path = "src"

[tool.pyright]
include = ["src/glossary_kit"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUntypedFunctionDecorator = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short --cov=glossary_kit --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["glossary_kit"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
fail_under = 80
